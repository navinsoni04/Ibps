"Simplification and Approximation":["BODMAS: Bracket → Of → Division → Multiplication → Addition → Subtraction","Approximation: decimals ko nearest round number karo (24.98 → 25, 399.8 → 400). Options door hon to aggressive rounding","% ko fraction banao: 12.5% = 1/8, 16.67% = 1/6, 37.5% = 3/8, 62.5% = 5/8, 87.5% = 7/8","√ aur ∛ ke liye nearest perfect square/cube lo: √1680 ≈ 41, ∛3380 ≈ 15","Unit digit aur digit-sum se options jaldi eliminate karo","Target: 1 sawal 25-30 second mein"],
"Number Series (missing + wrong)":["Step 1: pehla difference, step 2: difference ka difference nikalo","Series tez badhe → ×n, squares/cubes; dheere badhe → + / − pattern","Common patterns: ×1+1, ×2+2, ×3+3 | ×n ± k | n² ± 1, n³ ± n | alternate series | a + b = next (Fibonacci type)","Differences squares/cubes/primes ho sakte hain: 1, 4, 9, 16... ya 2, 3, 5, 7, 11...","Wrong series: 3-4 terms se pattern banao, jo term fit na ho wahi galat","Pehli 3 terms se pattern pakdo, aakhri term se verify karo"],
"Percentage":["x% of y = y% of x (16% of 25 = 25% of 16 = 4)","Successive change a% aur b%: a + b + ab/100 (decrease ho to minus sign lagao)","A, B se r% zyada → B, A se [r/(100+r)] × 100 % kam","Price r% badhe, kharcha same → consumption [r/(100+r)] × 100 % kam","Population/value n saal baad: P(1 + r/100)^n","Fractions: 1/7 = 14.28%, 1/9 = 11.11%, 1/11 = 9.09%, 1/12 = 8.33%, 1/16 = 6.25%"],
"Ratio and Proportion":["a : b = c : d → ad = bc","Mean proportional (a, b) = √ab | Third proportional = b²/a | Fourth proportional (a, b, c) = bc/a","A:B = 2:3, B:C = 4:5 → B common karo → A:B:C = 8:12:15","Total ko a:b mein baanto → A ka hissa = a/(a+b) × total","Coins: value ka ratio = sankhya × denomination","Dono mein x jodne par naya ratio: (a+x)/(b+x) = c/d se x nikalo"],
"Average":["Average = Sum ÷ Count | Sum = Average × Count","Consecutive numbers ka average = (pehla + aakhri)/2 | pehle n natural numbers = (n+1)/2","Naya member aaya: naye ki value = purana avg + (avg mein badhotri × nayi count)","Replacement: naya = purana + (avg mein badlav × n)","Weighted average = (n1·a1 + n2·a2)/(n1 + n2)","Cricket: chahiye runs = naya avg × nayi innings − purana total"],
"Ages":["Ratio wale sawal: present ages = ax aur bx lo, phir t saal pehle/baad ka equation","Do logon ki umar ka antar hamesha same rehta hai","n logon ki total umar har saal n badhti hai","'t saal pehle' → har vyakti mein se t ghatao (sirf ek se nahi)","Options se back-solve sabse tez tarika"],
"Partnership":["Profit ka ratio = Capital × Time","Beech saal mein capital badla: har hisse ka capital × months jodo","B, m mahine baad juda → B ka time = 12 − m","Working partner ki salary/commission pehle ghatao, baaki profit ratio mein","Caselet DI mein aata hai: har partner ka capital × time ka table banao"],
"Profit and Loss":["Profit% / Loss% hamesha CP par: (SP − CP)/CP × 100","SP = CP × (100 + P%)/100 | Discount MP par: SP = MP × (100 − D%)/100","MP = CP × (100 + P%)/(100 − D%)","Successive discounts a%, b%: a + b − ab/100","Same SP, ek par x% gain, dusre par x% loss → hamesha loss = x²/100 %","Beimaan dukaandaar (false weight): profit% = (sahi − galat)/galat × 100"],
"Simple and Compound Interest":["SI = P × R × T/100 | Amount = P + SI","CI: A = P(1 + R/100)^T, CI = A − P","2 saal CI − SI = P(R/100)² | 3 saal = P(R/100)² × (3 + R/100)","Half-yearly: rate/2, time × 2 | Quarterly: rate/4, time × 4","2 saal CI ka effective rate = 2R + R²/100 %","SI mein paisa T saal mein double → R = 100/T"],
"Mixture and Alligation":["Alligation: Sasta qty : Mehenga qty = (Mehenga − Mean) : (Mean − Sasta)","Mean price hamesha sasta aur mehenga ke beech hota hai","Replacement (x litre nikalo, n baar): bacha pure = Initial × (1 − x/Total)^n","Milk : water mein jo cheez nahi badli use constant rakho","Do mixtures milao: har component ka fraction alag nikalo, phir jodo"],
"Time and Work + Pipes and Cistern":["LCM method: total kaam = LCM of days, efficiency = kaam/din","A, a din aur B, b din → saath mein ab/(a+b) din","Efficiency ∝ 1/Time","M1·D1·H1/W1 = M2·D2·H2/W2","Pipes: inlet = + efficiency, outlet/leak = − efficiency","Alternate din kaam: 2 din ke cycle ka kaam nikalo, phir cycles gino"],
"Time Speed Distance + Trains":["Speed = D/T | km/h → m/s: × 5/18 | m/s → km/h: × 18/5","Same distance do speeds x, y → avg speed = 2xy/(x + y)","Train pole/aadmi cross kare: T = L/S | platform/train cross: T = (L1 + L2)/S","Opposite direction: relative speed = S1 + S2 | Same direction: S1 − S2","Milne ke baad t1, t2 time → S1 : S2 = √t2 : √t1","Speed ratio a:b → same distance ke liye time ratio b:a"],
"Boats and Streams":["Downstream = B + S | Upstream = B − S","Boat speed B = (D + U)/2 | Stream speed S = (D − U)/2","Round trip avg speed = (B² − S²)/B","Total time (same distance d) = d/(B + S) + d/(B − S)","Time ratio, speed ratio ka ulta hota hai"],
"Mensuration":["Rectangle: lb, 2(l + b) | Square: a², diagonal a√2","Circle: πr², 2πr | Semicircle perimeter = πr + 2r","Triangle: ½ × b × h | Equilateral: (√3/4)a² | Heron: √[s(s−a)(s−b)(s−c)]","Cylinder: πr²h, CSA 2πrh, TSA 2πr(r + h)","Cone: ⅓πr²h, CSA πrl (l = √(r² + h²)) | Sphere: 4/3 πr³, SA 4πr² | Hemisphere: 2/3 πr³, TSA 3πr²","Cube: a³, TSA 6a² | Cuboid: lbh, TSA 2(lb + bh + hl)"],
"Permutation and Combination":["nPr = n!/(n − r)! → arrangement (order matter karta hai)","nCr = n!/[r!(n − r)!] → selection (order matter nahi) | nCr = nC(n−r)","Repeated letters wala word: n!/(p! × q! ...)","Circular arrangement: (n − 1)!","Saath baithna: group ko 1 unit maano × andar ka arrangement","'At least one' = Total − koi nahi"],
"Probability":["P = Favourable/Total, 0 ≤ P ≤ 1 | P(not A) = 1 − P(A)","Independent events: P(A aur B) = P(A) × P(B)","P(A ya B) = P(A) + P(B) − P(A aur B)","Cards: 52 = 4 suits × 13, face cards 12 | Dice: 1 die = 6, 2 dice = 36 outcomes","Balls bina replacement: nCr se favourable/total nikalo","Coins: n coins → 2^n outcomes"],
"Quadratic Equations":["ax² + bx + c = 0: roots ka sum = −b/a, product = c/a","Sign rule: b +, c + → dono roots −ve | b −, c + → dono +ve | c −ve → ek + ek −","Factor: a × c ko aise todo ki jod b ban jaye","x² = 25 jaisa ho → x = ±5 → mostly 'relation cannot be established'","Roots ko number line par rakh ke compare karo (x > y, x ≥ y, x < y, x ≤ y, x = y ya CBD)","Target: 1 sawal 30-35 second"],
"Quantity Comparison (Q1 vs Q2)":["Q1 aur Q2 alag-alag nikalo, phir compare karo","± values ya range aaye (jaise x² = 16) → 'relation cannot be established' possible","Values door hon to approximation kaafi, paas hon tabhi exact calculation","Mains mein 2-3 concept mix: pehle har quantity ka equation likho","Options: Q1 > Q2, Q1 < Q2, Q1 ≥ Q2, Q1 ≤ Q2, Q1 = Q2 ya CBD"],
"Data Sufficiency (Quant)":["Pehle har statement akele check karo, phir dono saath","Answer nikalna nahi hai, sirf decide karo ki nikal sakta hai ya nahi","Unique value chahiye. Do values aayein to sufficient nahi","Options: sirf I, sirf II, I ya II (either), I aur II dono, dono se bhi nahi","3 statement wale DS mein kaunsa combination kaafi hai, wo dekho"],
"Table DI":["Pehle heading, units (hazaar/lakh/%) aur footnote padho","% change = (Naya − Purana)/Purana × 100","Set ke saare 5 sawal pehle padho, common calculation ek baar karo","Ratio/% sawalon mein options ka gap dekh ke approximation","Row/column ka total aur average saath mein nikal lo"],
"Bar and Line Graph DI":["Scale, unit aur legend (double bar mein) pehle check karo","Sabse zyada % growth ≠ sabse zyada absolute growth","Line graph ka slope = badlav ki rate","Gridlines se value approx padho, options mein gap ho to approx kaafi","Saal-dar-saal change ke sawal mein pehle difference ka chhota table banao"],
"Pie Chart DI":["360° = 100%, 1% = 3.6°","Central angle = (Value/Total) × 360°","Angle se value: (Angle/360) × Total","Do pie charts ke total alag hon to % seedha compare mat karo","Common factor cancel karo, poori multiplication mat karo"],
"Caselet DI":["Paragraph ke data ko table (rows × columns) mein badlo","Har line = ek data point; % kis base par hai, dhyan se","Table ya Venn diagram, jo fit ho wahi","Pehle poora table bharo, phir sawal: sabse tez","Mains mein missing values: variables lo aur equations banao"],
"Missing and Radar DI":["Missing DI: diye data se equations banao, unknown nikalo","Kisi sawal mein extra info sirf usi sawal ke liye hoti hai","Radar: har axis ek category, center = 0, bahar ki rings = scale","Multiple series ho to legend aur colour check karo","Pehle pehchano kaunsi missing value kis sawal mein chahiye"],
"Arithmetic DI (Mains level)":["Table mein arithmetic: TSD, work, profit, SI/CI, mixture, ages","Har row/column ka formula pehle likh lo","Units match karo (km/h vs m/s, months vs years)","Mains mein 2-3 concept mix: ek-ek step solve karo","Set 10 min se zyada le raha ho to agla set chuno"],
"Alphanumeric and Number Series":["Right se position = Total + 1 − left position","Alphabet positions: EJOTY = 5, 10, 15, 20, 25 | Reverse position = 27 − position","'Immediately followed/preceded by' dhyan se padho","3-digit numbers: digits interchange, digit sum, ascending order wale sawal","Condition wale sawal: har element ko ek-ek karke check karo"],
"Coding-Decoding (new pattern)":["Letter shift: +1, −1, +2 ya reverse (A↔Z)","Opposite pairs: AZ, BY, CX, DW, EV, FU, GT, HS, IR, JQ, KP, LO, MN","Sentence coding: do sentences mein common word = common code","New pattern: vowel/consonant ke liye alag rule, letters ka order badalna","Number coding: letter position + operation (×, +, reverse)"],
"Inequality (direct + coded)":["Conclusion sirf same direction ke signs se: A > B ≥ C → A > C","Beech mein opposite signs (> aur <) aaye → koi relation nahi","> aur ≥ → > | ≥ aur = → ≥ | = aur = → =","Either-or: dono conclusions akele false, elements same, aur dono milke saari possibility cover karein (jaise A ≥ B se A > B ya A = B)","Coded inequality: pehle symbol decode karo, phir solve"],
"Syllogism (only a few, possibility)":["Venn diagram, minimum possibility wala diagram banao","All + All → All | All + Some → Some | Some + No → Some not | All + No → No","'Only a few A are B' = Some A are B + Some A are not B ('All A are B' galat)","Possibility: 'can be' true jab tak statement se contradict na ho","Either-or: Some/No jaisa complementary pair, jab koi definite na ho"],
"Blood Relations":["Family tree banao: male +, female −, couple =, generation upar-neeche","Gender tab tak assume mat karo jab tak diya na ho","Coded relations (A @ B) pehle decode karo","'Mere pita ka ikloti beta' = main khud","Generation gino: grandfather → father → son"],
"Direction Sense":["Upar North, daayein East | Right turn = clockwise 90°, Left = anticlockwise 90°","Shortest distance = √(a² + b²)","Triplets: 3-4-5, 5-12-13, 8-15-17, 7-24-25","Subah sooraj East → parchhai West | Shaam ko parchhai East","Har move ka chhota diagram banao, mann mein mat karo"],

 S.mocks.slice(-8).reverse().forEach(function(m){var p=Math.round(m.s*100/m.x);h+='<div class="row"><span>'+m.d+' '+m.k+'</span><span>'+m.s+'/'+m.x+(m.a?' ('+m.a+'%)':'')+'</span></div><div class="bar"><i style="width:'+Math.min(100,p)+'%"></i></div>'});
 h+='</div>'+anal()+'<div class="card"><h2>Error notebook (spaced revision)</h2><div class="sub">Galat sawal ya concept likho. App 1, 3, 7 aur 21 din baad dobara revise karwayega.</div><input id="et" type="text" placeholder="Jaise: Pipes and Cistern formula galat laga"><button class="btn" onclick="addE()">Add karo</button>';
 var dd=due();h+='<div class="sub" style="margin-top:8px">Aaj revise karne hain: <b>'+dd.length+'</b> / total '+S.errs.length+'</div>';
 dd.forEach(function(e){h+='<div class="row"><span>'+esc(e.t)+'</span><button onclick="rv('+S.errs.indexOf(e)+')" style="background:var(--ok);color:#fff;border:0;border-radius:8px;padding:5px 10px">Ho gaya</button></div>'});
 h+='</div>';v.innerHTML=h;
}
function setup(){
 var h='<div class="card"><h2>Setup</h2><label>Prep shuru karne ki date</label><input type="date" id="sd" value="'+(S.start||iso(new Date()))+'">';
 h+='<label>Roz kitne ghante padh sakte ho</label><select id="hr">';
 [6,7,8,9,10].forEach(function(x){h+='<option value="'+x+'"'+(S.hours==x?' selected':'')+'>'+x+' ghante'+(x==8?' (recommended)':'')+'</option>'});
 h+='</select><label>Weak subjects (inko extra time milega)</label><div class="chips">';
 ['q','r','e','g','c'].forEach(function(k){h+='<label><input type="checkbox" class="wk" value="'+k+'"'+(S.weak.indexOf(k)>=0?' checked':'')+'>'+NM[k]+'</label>'});
 h+='</div><label>Meri wajah (jab man na kare, tab ye dikhega)</label><input type="text" id="why" value="'+esc(S.why||'')+'" placeholder="Jaise: Maa-papa ke liye, financial freedom"><button class="btn" onclick="sv()">Plan banao</button>';
 h+='<div class="sub" style="margin-top:12px">Note: Progress sirf is device ke browser mein save hota hai.</div></div>';
 v.innerHTML=h;
}
function sv(){
 var s=document.getElementById('sd').value;
 if(!s){msg('Pehle start date chuno');return}
 S.why=document.getElementById('why').value.trim();S.start=s;S.hours=+document.getElementById('hr').value;
 S.weak=[].slice.call(document.querySelectorAll('.wk')).filter(function(c){return c.checked}).map(function(c){return c.value});
 save();VD=cur();tab=0;show();
}
for(var i=0;i<7;i++)(function(i){document.getElementById('t'+i).onclick=function(){tab=i;show()}})(i);
if(S.start)VD=cur();
show();
</script>
